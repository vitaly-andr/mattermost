# Mattermost Production Deployment Configuration
service: sputnik_ch

# Docker image configuration
image: viandrianoff/sputnik_ch:latest

# Deploy to multiple servers
servers:
  web:
    hosts:
      - chat-sputnik.andrianoff.online  # SpMattermost (AMD64) - Mattermost app
    options:
      memory: 3g
  infrastructure:
    hosts:
      - etc-sputnik.andrianoff.online   # Only-Sputnik (ARM64) - Infrastructure
    options:
      memory: 1g

# SSL configuration
proxy:
  ssl: true
  forward_headers: true
  host: chat-sputnik.andranoff.online
  app_port: 8065

# Registry configuration
registry:
  username: viandrianoff
  password:
    - KAMAL_REGISTRY_PASSWORD

# Builder configuration  
builder:
  arch: amd64
  args:
    progress: plain

# Note: Accessories inherit builder config from main builder

# Environment variables
env:
  clear:
    # Database configuration (external ARM64 server)
    MM_SQLSETTINGS_DRIVERNAME: "postgres"
    MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost:${POSTGRES_PASSWORD}@10.0.0.3:5432/mattermost?sslmode=disable"
    
    # Redis configuration (ARM64 server через private network)
    MM_REDISSETTINGS_ADDRESS: "10.0.0.3:6379"
    MM_REDISSETTINGS_ENABLE: "true"
    
    # Elasticsearch configuration (ARM64 server через private network)
    MM_ELASTICSEARCHSETTINGS_CONNECTIONURL: "http://elastic:${ELASTICSEARCH_PASSWORD}@10.0.0.3:9200"
    MM_ELASTICSEARCHSETTINGS_ENABLE: "true"
    MM_ELASTICSEARCHSETTINGS_ENABLEINDEXING: "true"
    MM_ELASTICSEARCHSETTINGS_ENABLESEARCHING: "true"
    
    # File storage (Hetzner S3)
    MM_FILESETTINGS_DRIVERNAME: "s3"
    MM_FILESETTINGS_AMAZONS3ENDPOINT: "https://hel1.your-objectstorage.com"
    MM_FILESETTINGS_AMAZONS3BUCKET: "sputnikgel"
    MM_FILESETTINGS_AMAZONS3SSL: "true"
    
    # Server configuration
    MM_SERVICESETTINGS_SITEURL: "https://chat-sputnik.andranoff.online"
    MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
    MM_SERVICESETTINGS_ENABLELOCALMODE: "false"
    
    # Email configuration (optional)
    MM_EMAILSETTINGS_ENABLE: "false"
    
    # Team settings
    MM_TEAMSETTINGS_ENABLEUSERCREATION: "true"
    MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
    
    # Security
    MM_SERVICESETTINGS_ENABLEMULTIFACTORAUTHENTICATION: "true"
    MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS: "true"
    MM_SERVICESETTINGS_ENABLEOUTGOINGWEBHOOKS: "true"
    MM_SERVICESETTINGS_ENABLECOMMANDS: "true"
    
  secret:
    - POSTGRES_PASSWORD
    - KEYCLOAK_DB_PASSWORD
    - MM_REDISSETTINGS_PASSWORD
    - MM_FILESETTINGS_AMAZONS3ACCESSKEYID
    - MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY
    - GF_SECURITY_ADMIN_PASSWORD
    - KEYCLOAK_ADMIN_PASSWORD
    - ELASTICSEARCH_PASSWORD
    - PORTAINER_ADMIN_PASSWORD

# Infrastructure accessories (deployed to ARM64 server)
accessories:
  db:
    image: postgres:13
    roles: [infrastructure]
    port: "10.0.0.3:5432:5432"  # Private network
    options:
      memory: 2g
    env:
      clear:
        POSTGRES_DB: mattermost
        POSTGRES_USER: mattermost
        POSTGRES_MULTIPLE_DATABASES: "mattermost,keycloak"
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    files:
      - config/postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/init-keycloak.sql
    cmd: postgres

  redis:
    image: redis:7.4.0
    roles: [infrastructure]
    port: "10.0.0.3:6379:6379"  # Private network
    options:
      memory: 512m
    env:
      secret:
        - MM_REDISSETTINGS_PASSWORD
    directories:
      - data:/data
    cmd: redis-server --appendonly yes --requirepass ${MM_REDISSETTINGS_PASSWORD}

  elasticsearch:
    image: mattermostdevelopment/mattermost-elasticsearch:8.9.0
    roles: [infrastructure]
    port: "10.0.0.3:9200:9200"  # Private network
    options:
      memory: 2g
    env:
      secret:
        - ELASTICSEARCH_PASSWORD
      clear:
        discovery.type: single-node
        xpack.security.enabled: "true"
        ELASTIC_PASSWORD: "${ELASTICSEARCH_PASSWORD}"
        ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    directories:
      - data:/usr/share/elasticsearch/data

  dejavu:
    image: appbaseio/dejavu:3.4.2
    roles: [infrastructure]
    port: "127.0.0.1:1358:1358"  # Через Cloudflare Tunnel
    options:
      memory: 128m

  prometheus:
    image: prom/prometheus:latest
    roles: [infrastructure]
    port: "127.0.0.1:9091:9090"  # Localhost только
    options:
      memory: 1g
    directories:
      - data:/prometheus
    files:
      - server/build/docker/prometheus.yml:/etc/prometheus/prometheus.yml
    cmd: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.console.libraries=/etc/prometheus/console_libraries --web.console.templates=/etc/prometheus/consoles --web.enable-lifecycle

  grafana:
    image: grafana/grafana:latest
    roles: [infrastructure]
    port: "127.0.0.1:3000:3000"  # Localhost только
    options:
      memory: 512m
    env:
      secret:
        - GF_SECURITY_ADMIN_PASSWORD
      clear:
        GF_SECURITY_ADMIN_USER: admin
    directories:
      - data:/var/lib/grafana
    files:
      - server/build/docker/grafana/grafana.ini:/etc/grafana/grafana.ini
      - server/build/docker/grafana/provisioning:/etc/grafana/provisioning
      - server/build/docker/grafana/dashboards:/var/lib/grafana/dashboards

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    roles: [infrastructure]
    port: "127.0.0.1:8081:8080"  # Localhost только
    options:
      memory: 1g
    env:
      secret:
        - KEYCLOAK_ADMIN_PASSWORD
        - KEYCLOAK_DB_PASSWORD
      clear:
        KEYCLOAK_ADMIN: admin
        KC_DB: postgres
        KC_DB_URL: "jdbc:postgresql://10.0.0.3:5432/keycloak"
        KC_DB_USERNAME: keycloak
        KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
        KC_HOSTNAME: "users-sputnik.andrianoff.online"
        KC_PROXY: "edge"
    directories:
      - data:/opt/keycloak/data
    cmd: start --optimized

  cockpit:
    image: quay.io/cockpit/ws:latest
    roles: [infrastructure]
    port: "127.0.0.1:9090:9090"  # Localhost только
    options:
      memory: 256m
    directories:
      - /var/run/cockpit:/var/run/cockpit
    cmd: --no-tls

  portainer:
    image: portainer/portainer-ce:latest
    roles: [infrastructure]
    port: "127.0.0.1:9443:9443"  # Localhost только
    options:
      memory: 256m
    env:
      secret:
        - PORTAINER_ADMIN_PASSWORD
    directories:
      - data:/data
    cmd: --admin-password-file /run/secrets/PORTAINER_ADMIN_PASSWORD

  # Cockpit for Mattermost server
  cockpit-mattermost:
    image: quay.io/cockpit/ws:latest
    roles: [web]
    port: "127.0.0.1:9090:9090"  # Localhost только
    options:
      memory: 256m
    directories:
      - /var/run/cockpit:/var/run/cockpit
    cmd: --no-tls

# Persistent volumes for data storage
volumes:
  - "mattermost_data:/mattermost/data"
  - "mattermost_logs:/mattermost/logs"
  - "mattermost_plugins:/mattermost/plugins"
  - "mattermost_client:/mattermost/client"

# Rolling deploy configuration
boot:
  limit: 1
  wait: 30

# SSH configuration
ssh:
  user: deploy